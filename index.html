<title>クイズスタンプラリー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* ---- design plan ----
   layout: single full-height mobile "card" screen; JS swaps one <section> visible at a time;
            a warm flat house-row illustration anchors the bottom of every screen.
   color:  warm cream ground, ink-brown text, cobalt for quiz identity, amber for stamps/celebration,
           coral for a wrong answer, sage for a correct one.
   type:   Kiwi Maru (rounded, hand-drawn) for all display headlines; Zen Kaku Gothic New for body/UI.
*/
:root{
  --bg:#FFFFFF;
  --surface:#FFFFFF;
  --ink:#3A2E22;
  --muted:#8A7A66;
  --cobalt:#4C6EF5;
  --cobalt-ink:#28349B;
  --red:#E13A2E;
  --red-ink:#A22419;
  --purple:#8452DE;
  --purple-ink:#5A339F;
  --amber:#E0932A;
  --amber-ink:#9C5F0F;
  --sage:#3F9160;
  --sage-ink:#256B41;
  --line:#EADFC9;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#221C15;
    --surface:#2C241A;
    --ink:#F3E9D8;
    --muted:#B9A78C;
    --cobalt:#8AA0FF;
    --cobalt-ink:#B7C4FF;
    --red:#FF7A6B;
    --red-ink:#FFA79B;
    --purple:#B79BFF;
    --purple-ink:#D3C2FF;
    --amber:#F0AC4E;
    --amber-ink:#F7CE94;
    --sage:#6BC98D;
    --sage-ink:#9CDFB3;
    --line:#3B3225;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#221C15;
  --surface:#2C241A;
  --ink:#F3E9D8;
  --muted:#B9A78C;
  --cobalt:#8AA0FF;
  --cobalt-ink:#B7C4FF;
  --red:#FF7A6B;
  --red-ink:#FFA79B;
  --purple:#B79BFF;
  --purple-ink:#D3C2FF;
  --amber:#F0AC4E;
  --amber-ink:#F7CE94;
  --sage:#6BC98D;
  --sage-ink:#9CDFB3;
  --line:#3B3225;
  color-scheme: dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Zen Kaku Gothic New', sans-serif;
  display:flex;
  justify-content:center;
}
#app{
  width:100%;
  max-width:480px;
  min-height:100%;
  display:flex;
  flex-direction:column;
  position:relative;
}
.screen{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  padding:28px 24px 0;
  min-height:560px;
  animation:fadein .35s ease both;
}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  .screen{animation:none}
}

.eyebrow{
  font-family:'Zen Kaku Gothic New',sans-serif;
  font-weight:700;
  font-size:.78rem;
  letter-spacing:.16em;
  color:var(--muted);
  margin:0 0 4px;
}
h1.headline{
  font-family:'Zen Maru Gothic',sans-serif;
  font-weight:900;
  font-size:2.2rem;
  line-height:1.35;
  color:var(--cobalt-ink);
  text-align:center;
  text-wrap:balance;
  margin:.2em 0 .1em;
  letter-spacing:.01em;
}
.badge-number{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:1.9em;
  height:1.9em;
  border:4px solid currentColor;
  border-radius:50%;
  font-size:.85em;
  margin-left:.18em;
  vertical-align:middle;
}

.subtext{
  font-size:.95rem;
  color:var(--muted);
  text-align:center;
  margin:.3em 0 0;
}

.tap-hint{
  margin-top:14px;
  font-size:.85rem;
  color:var(--muted);
}

.spacer{flex:1}
.spacer-sm{height:18px}

.question-card{
  width:100%;
  text-align:center;
  margin-top:22px;
}
.question-text{
  font-size:1.15rem;
  font-weight:700;
  line-height:1.6;
  text-align:left;
  min-height:3.2em;
}

.choices{
  width:100%;
  display:flex;
  flex-direction:column;
  gap:12px;
  margin-top:24px;
}
.choice-btn{
  font-family:'Zen Maru Gothic',sans-serif;
  font-weight:700;
  font-size:1.05rem;
  text-align:left;
  display:flex;
  align-items:center;
  gap:14px;
  width:100%;
  padding:16px 18px;
  border-radius:16px;
  border:2px solid var(--line);
  background:var(--surface);
  color:var(--ink);
  cursor:pointer;
  transition:transform .12s ease, border-color .12s ease, background .12s ease;
}
.choice-btn:active{transform:scale(.98)}
.choice-btn:hover{border-color:var(--cobalt)}
.choice-btn:focus-visible{outline:3px solid var(--cobalt); outline-offset:2px}
.choice-letter{
  flex:0 0 auto;
  width:2em;height:2em;
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-weight:900;
  color:#fff;
  font-family:'Zen Maru Gothic',sans-serif;
}
.choice-btn[data-letter="A"] .choice-letter{background:var(--red)}
.choice-btn[data-letter="B"] .choice-letter{background:var(--cobalt)}
.choice-btn[data-letter="C"] .choice-letter{background:var(--sage)}

.result-text{
  font-family:'Zen Maru Gothic',sans-serif;
  font-weight:900;
  font-size:2.5rem;
  line-height:1.3;
  text-align:center;
  margin:.3em 0;
  text-wrap:balance;
}
.result-text.wrong{color:var(--cobalt-ink)}
.result-text.correct{color:var(--red)}

.explain-box{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:16px;
  padding:18px;
  width:100%;
  margin-top:6px;
  font-size:.95rem;
  line-height:1.8;
}
.explain-label{
  font-size:.75rem;
  color:var(--muted);
  letter-spacing:.1em;
  margin-bottom:6px;
}

.primary-btn{
  font-family:'Zen Maru Gothic',sans-serif;
  font-size:1.1rem;
  font-weight:700;
  color:#fff;
  background:var(--cobalt);
  border:none;
  border-radius:999px;
  padding:15px 34px;
  cursor:pointer;
  box-shadow:0 4px 0 var(--cobalt-ink);
  transition:transform .12s ease, box-shadow .12s ease;
}
.primary-btn:active{transform:translateY(3px); box-shadow:0 1px 0 var(--cobalt-ink)}
.primary-btn:focus-visible{outline:3px solid var(--ink); outline-offset:3px}
.primary-btn.navy-variant{background:var(--cobalt-ink); box-shadow:0 4px 0 var(--ink)}
.primary-btn.navy-variant:active{box-shadow:0 1px 0 var(--ink)}
.primary-btn.red-variant{background:var(--red); box-shadow:0 4px 0 var(--red-ink)}
.primary-btn.red-variant:active{box-shadow:0 1px 0 var(--red-ink)}
.primary-btn.purple-variant{background:var(--purple); box-shadow:0 4px 0 var(--purple-ink)}
.primary-btn.purple-variant:active{box-shadow:0 1px 0 var(--purple-ink)}

.stamp-row{
  display:flex;
  gap:18px;
  margin:22px 0 6px;
  justify-content:center;
  flex-wrap:wrap;
}
.stamp-wrap{
  position:relative;
  width:108px;height:108px;
}
.stamp{
  width:108px;height:108px;
  position:relative;
  z-index:2;
  animation:pop .55s cubic-bezier(.26,1.6,.5,1) both;
}
.stamp.pending{opacity:.28; filter:grayscale(1); animation:none}
@keyframes pop{
  0%{transform:scale(.2) rotate(-14deg); opacity:0}
  70%{transform:scale(1.12) rotate(4deg); opacity:1}
  100%{transform:scale(1) rotate(0)}
}
.sparkle{
  position:absolute;
  width:20px;height:20px;
  color:var(--amber);
  opacity:0;
  z-index:3;
  animation:twinkle 1.1s ease-out both;
  pointer-events:none;
}
@keyframes twinkle{
  0%{opacity:0; transform:scale(.1) rotate(0deg)}
  30%{opacity:1; transform:scale(1.2) rotate(20deg)}
  60%{opacity:1; transform:scale(.85) rotate(-14deg)}
  100%{opacity:0; transform:scale(.2) rotate(6deg)}
}
@media (prefers-reduced-motion:reduce){
  .stamp{animation:none}
  .sparkle{display:none}
}

.type-cursor{
  display:inline-block;
  width:.08em;
  margin-left:.05em;
  border-right:.11em solid currentColor;
  animation:blink 1s step-end infinite;
}
@keyframes blink{50%{border-color:transparent}}
@media (prefers-reduced-motion:reduce){
  .type-cursor{display:none}
}

.town{
  width:100%;
  display:block;
  margin-top:auto;
  object-fit:cover;
  object-position:top;
  max-height:180px;
}

.gift-wrap{margin:20px 0}

.thanks-img{
  width:100%;
  max-width:280px;
  margin:14px 0 6px;
  position:relative;
  z-index:2;
}

#screen-thanks{position:relative; overflow:hidden}
.confetti-stage{
  position:absolute;
  inset:0;
  overflow:hidden;
  pointer-events:none;
  z-index:1;
}
.confetti-piece{
  position:absolute;
  left:50%;
  top:38%;
  width:9px;height:15px;
  background:var(--c, var(--red));
  border-radius:2px;
  opacity:0;
  animation-name:confetti-burst;
  animation-timing-function:cubic-bezier(.15,.7,.3,1);
  animation-fill-mode:forwards;
}
.confetti-piece.streamer{
  width:4px;
  height:56px;
  border-radius:3px;
}
@keyframes confetti-burst{
  0%{ transform:translate(-50%,-50%) translate(0,0) rotate(0deg); opacity:1 }
  65%{ opacity:1 }
  100%{ transform:translate(-50%,-50%) translate(var(--x), var(--y)) rotate(var(--rot)); opacity:0 }
}
@media (prefers-reduced-motion:reduce){
  .confetti-stage{display:none}
}

.staff-box{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:16px;
  padding:16px;
  width:100%;
  text-align:center;
  margin-top:16px;
  font-size:.95rem;
}

.confirm-mark{
  width:120px;height:120px;
  margin:8px 0 4px;
}

[hidden]{display:none!important}
</style>

<div id="app">

  <!-- START -->
  <section class="screen" id="screen-start">
    <div class="spacer"></div>
    <p class="eyebrow">PRINCIPAL HOME</p>
    <h1 class="headline">クイズ<br>スタンプラリー</h1>
    <p class="subtext">全問正解でプレゼントがもらえるよ!</p>
    <div class="spacer-sm"></div>
    <button class="primary-btn" id="btn-start">スタート</button>
    <p class="tap-hint">タップしてクイズを始めよう!</p>
    <div class="spacer"></div>
    <img class="town" src="town.png" alt="" aria-hidden="true">
  </section>

  <!-- QUESTION -->
  <section class="screen" id="screen-question" hidden>
    <p class="eyebrow" id="q-eyebrow">QUESTION</p>
    <h1 class="headline">クイズ<span class="badge-number" id="q-number">1</span></h1>
    <div class="question-card">
      <p class="question-text" id="q-text">問題文がここに入ります</p>
    </div>
    <div class="choices" id="q-choices"></div>
    <div class="spacer"></div>
    <img class="town" src="town.png" alt="" aria-hidden="true">
  </section>

  <!-- WRONG -->
  <section class="screen" id="screen-wrong" hidden>
    <p class="eyebrow" id="wrong-eyebrow" style="color:var(--cobalt-ink)">問題1の不正解</p>
    <div class="spacer-sm"></div>
    <p class="result-text wrong">残念、<br>不正解</p>
    <div class="spacer-sm"></div>
    <button class="primary-btn navy-variant" id="btn-wrong-back">問題へ戻る</button>
    <div class="spacer"></div>
    <img class="town" src="town.png" alt="" aria-hidden="true">
  </section>

  <!-- CORRECT -->
  <section class="screen" id="screen-correct" hidden>
    <p class="eyebrow" id="correct-eyebrow" style="color:var(--red)">問題1の正解</p>
    <div class="spacer-sm"></div>
    <p class="result-text correct">正解!</p>
    <div class="explain-box">
      <p class="explain-label">解説</p>
      <p id="correct-explain">解説文がここに入ります</p>
    </div>
    <div class="spacer-sm"></div>
    <button class="primary-btn red-variant" id="btn-correct-next">次へ</button>
    <div class="spacer"></div>
    <img class="town" src="town.png" alt="" aria-hidden="true">
  </section>

  <!-- STAMP -->
  <section class="screen" id="screen-stamp" hidden>
    <p class="eyebrow" id="stamp-eyebrow" style="color:var(--purple-ink)">正解スタンプ</p>
    <h1 class="headline" style="color:var(--purple-ink)" id="stamp-headline">スタンプGET!</h1>
    <div class="stamp-row" id="stamp-row"></div>
    <p class="subtext" id="stamp-sub">その調子!次の問題に進もう</p>
    <div class="spacer-sm"></div>
    <button class="primary-btn red-variant" id="btn-stamp-next">次の問題へ</button>
    <div class="spacer"></div>
    <img class="town" src="town.png" alt="" aria-hidden="true">
  </section>

  <!-- PRESENT -->
  <section class="screen" id="screen-present" hidden>
    <div class="spacer-sm"></div>
    <p class="eyebrow" style="color:var(--cobalt-ink)">この画面をスタッフに見せて</p>
    <h1 class="headline">プレゼントを<br>もらおう!</h1>
    <div class="gift-wrap">
      <svg width="150" height="150" viewBox="0 0 150 150" aria-hidden="true">
        <use href="#gift-icon"></use>
      </svg>
    </div>
    <div class="staff-box">
      このQRコードの画面を会場スタッフに見せてください。<br>確認後、下のボタンをスタッフが押します。
    </div>
    <div class="spacer-sm"></div>
    <button class="primary-btn" id="btn-staff-tap">スタッフがタップ</button>
    <div class="spacer"></div>
    <img class="town" src="town.png" alt="" aria-hidden="true">
  </section>

  <!-- THANKS -->
  <section class="screen" id="screen-thanks" hidden>
    <div class="confetti-stage" id="confetti-stage"></div>
    <div class="spacer"></div>
    <p class="eyebrow" style="color:var(--sage-ink)">確認済み</p>
    <img class="thanks-img" src="thankyou.png" alt="Thank you!">
    <p class="subtext">引き続きイベントをお楽しみください‼️</p>
    <div class="spacer"></div>
    <img class="town" src="town.png" alt="" aria-hidden="true">
  </section>

</div>

<!-- shared graphics -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <g id="gift-icon">
      <rect x="20" y="60" width="110" height="78" rx="10" fill="var(--amber)"></rect>
      <rect x="20" y="60" width="110" height="24" fill="var(--amber-ink)" opacity=".18"></rect>
      <rect x="64" y="60" width="22" height="78" fill="var(--red)"></rect>
      <path d="M75 60 C55 34, 20 40, 40 62 C50 56, 66 56, 75 60 Z" fill="var(--red)"></path>
      <path d="M75 60 C95 34, 130 40, 110 62 C100 56, 84 56, 75 60 Z" fill="var(--red)"></path>
    </g>

    <g id="sparkle-star">
      <path d="M12 0 C12.8 6.4, 17.6 11.2, 24 12 C17.6 12.8, 12.8 17.6, 12 24 C11.2 17.6, 6.4 12.8, 0 12 C6.4 11.2, 11.2 6.4, 12 0 Z" fill="currentColor"></path>
    </g>

    <g id="check-icon">
      <circle cx="60" cy="60" r="56" fill="var(--sage)"></circle>
      <path d="M34 61 L52 79 L88 41" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"></path>
    </g>

    <g id="stamp-mark">
      <circle cx="60" cy="60" r="56" fill="none" stroke="var(--amber)" stroke-width="6"></circle>
      <circle cx="60" cy="60" r="46" fill="none" stroke="var(--amber)" stroke-width="2" stroke-dasharray="3 5"></circle>
      <path d="M60 30 L64 40 L75 40 L66 47 L69 58 L60 51 L51 58 L54 47 L45 40 L56 40 Z" fill="var(--amber)"></path>
      <text x="60" y="82" text-anchor="middle" font-family="Zen Maru Gothic, sans-serif" font-size="16" fill="var(--amber-ink)" font-weight="900">GET!</text>
      <text x="60" y="98" text-anchor="middle" font-family="Zen Kaku Gothic New, sans-serif" font-size="7" letter-spacing="1" fill="var(--amber-ink)">PRINCIPAL HOME</text>
    </g>
  </defs>
</svg>

<script>
(function(){
  "use strict";

  var QUESTIONS = [
    {
      text: "地震の揺れを吸収して、建物へのダメージを減らす装置は?",
      choices: ["ダンパー", "換気扇", "蛇口"],
      correct: 0,
      explain: "正解です!ダンパーは地震の揺れを吸収する装置で、建物の負担を減らし、繰り返しの揺れにも強くします。"
    },
    {
      text: "家を夏は涼しく、冬は暖かくするために壁や天井に入れるものは?",
      choices: ["断熱材", "新聞紙", "砂"],
      correct: 0,
      explain: "正解です!断熱材を使うことで、外の暑さ・寒さが室内に伝わりにくくなり、快適な住まいになります。"
    },
    {
      text: "建物の重さをしっかり地面に伝える、家の土台となる工事は?",
      choices: ["基礎工事", "内装工事", "外構工事"],
      correct: 0,
      explain: "正解です!基礎工事は建物を支える大事な土台づくりで、家の耐久性や耐震性に直結します。"
    }
  ];

  var LETTERS = ["A", "B", "C"];

  var state = { current: 0 };

  var screens = {};
  ["start","question","wrong","correct","stamp","present","thanks"].forEach(function(name){
    screens[name] = document.getElementById("screen-" + name);
  });

  function show(name){
    Object.keys(screens).forEach(function(key){
      screens[key].hidden = (key !== name);
    });
    screens[name].classList.remove("screen");
    void screens[name].offsetWidth;
    screens[name].classList.add("screen");
    window.scrollTo(0, 0);
  }

  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var typeTimer = null;

  function typeText(el, text, speed){
    if (typeTimer){ clearInterval(typeTimer); typeTimer = null; }
    if (reduceMotion){
      el.textContent = text;
      return;
    }
    el.textContent = "";
    var cursor = document.createElement("span");
    cursor.className = "type-cursor";
    el.appendChild(cursor);
    var i = 0;
    typeTimer = setInterval(function(){
      i++;
      el.textContent = text.slice(0, i);
      el.appendChild(cursor);
      if (i >= text.length){
        clearInterval(typeTimer);
        typeTimer = null;
        cursor.remove();
      }
    }, speed || 45);
  }

  function renderQuestion(){
    var idx = state.current;
    var q = QUESTIONS[idx];
    document.getElementById("q-eyebrow").textContent = "QUESTION " + (idx + 1) + " / " + QUESTIONS.length;
    document.getElementById("q-number").textContent = (idx + 1);
    typeText(document.getElementById("q-text"), q.text, 45);

    var wrap = document.getElementById("q-choices");
    wrap.innerHTML = "";
    q.choices.forEach(function(label, i){
      var btn = document.createElement("button");
      btn.className = "choice-btn";
      btn.setAttribute("data-letter", LETTERS[i]);
      btn.innerHTML = '<span class="choice-letter">' + LETTERS[i] + '</span><span>' + label + '</span>';
      btn.addEventListener("click", function(){ onAnswer(i); });
      wrap.appendChild(btn);
    });

    show("question");
  }

  function onAnswer(choiceIndex){
    var idx = state.current;
    var q = QUESTIONS[idx];
    if (choiceIndex === q.correct){
      document.getElementById("correct-eyebrow").textContent = "問題" + (idx + 1) + "の正解";
      document.getElementById("correct-explain").textContent = q.explain;
      show("correct");
    } else {
      document.getElementById("wrong-eyebrow").textContent = "問題" + (idx + 1) + "の不正解";
      document.getElementById("btn-wrong-back").textContent = "問題" + (idx + 1) + "へ戻る";
      show("wrong");
    }
  }

  function renderStamp(){
    var idx = state.current;
    var isLast = (idx === QUESTIONS.length - 1);

    document.getElementById("stamp-eyebrow").textContent = "正解スタンプ " + (idx + 1);
    document.getElementById("stamp-headline").textContent = isLast ? "全問正解!" : "スタンプGET!";

    var SPARKLE_SPOTS = [
      { top: "-6px", left: "-4px", delay: "0s", size: "18px" },
      { top: "6px", left: "84px", delay: ".12s", size: "22px" },
      { top: "78px", left: "-8px", delay: ".24s", size: "16px" },
      { top: "84px", left: "86px", delay: ".08s", size: "18px" },
      { top: "-10px", left: "46px", delay: ".3s", size: "14px" }
    ];

    var row = document.getElementById("stamp-row");
    row.innerHTML = "";
    for (var i = 0; i < QUESTIONS.length; i++){
      var wrap = document.createElement("div");
      wrap.className = "stamp-wrap";

      var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.setAttribute("viewBox", "0 0 120 120");
      svg.setAttribute("class", "stamp" + (i <= idx ? "" : " pending"));
      var use = document.createElementNS("http://www.w3.org/2000/svg", "use");
      use.setAttribute("href", "#stamp-mark");
      svg.appendChild(use);
      wrap.appendChild(svg);

      if (i === idx && !reduceMotion){
        SPARKLE_SPOTS.forEach(function(spot){
          var s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
          s.setAttribute("viewBox", "0 0 24 24");
          s.setAttribute("class", "sparkle");
          s.style.top = spot.top;
          s.style.left = spot.left;
          s.style.width = spot.size;
          s.style.height = spot.size;
          s.style.animationDelay = spot.delay;
          var su = document.createElementNS("http://www.w3.org/2000/svg", "use");
          su.setAttribute("href", "#sparkle-star");
          s.appendChild(su);
          wrap.appendChild(s);
        });
      }

      row.appendChild(wrap);
    }

    var sub = document.getElementById("stamp-sub");
    var nextBtn = document.getElementById("btn-stamp-next");
    if (isLast){
      sub.textContent = "3問すべて正解しました!";
      nextBtn.textContent = "タップしてプレゼントをゲット!";
    } else {
      sub.textContent = "その調子!次の問題に進もう";
      nextBtn.textContent = "次の問題へ";
    }

    show("stamp");
  }

  document.getElementById("btn-start").addEventListener("click", function(){
    state.current = 0;
    renderQuestion();
  });

  document.getElementById("btn-wrong-back").addEventListener("click", function(){
    renderQuestion();
  });

  document.getElementById("btn-correct-next").addEventListener("click", function(){
    renderStamp();
  });

  document.getElementById("btn-stamp-next").addEventListener("click", function(){
    var isLast = (state.current === QUESTIONS.length - 1);
    if (isLast){
      show("present");
    } else {
      state.current += 1;
      renderQuestion();
    }
  });

  function fireConfetti(){
    var stage = document.getElementById("confetti-stage");
    stage.innerHTML = "";
    if (reduceMotion) return;

    var colors = ["var(--red)", "var(--cobalt)", "var(--purple)", "var(--amber)", "var(--sage)"];
    var total = 34;
    for (var i = 0; i < total; i++){
      var piece = document.createElement("div");
      var isStreamer = (i % 4 === 0);
      piece.className = "confetti-piece" + (isStreamer ? " streamer" : "");

      var angle = Math.random() * Math.PI * 2;
      var dist = 120 + Math.random() * 150;
      var x = Math.cos(angle) * dist;
      var y = Math.sin(angle) * dist * 0.75 + 60;
      var rot = (Math.random() * 720 - 360);

      piece.style.setProperty("--x", x.toFixed(0) + "px");
      piece.style.setProperty("--y", y.toFixed(0) + "px");
      piece.style.setProperty("--rot", rot.toFixed(0) + "deg");
      piece.style.setProperty("--c", colors[i % colors.length]);
      piece.style.animationDuration = (0.9 + Math.random() * 0.6).toFixed(2) + "s";
      piece.style.animationDelay = (Math.random() * 0.15).toFixed(2) + "s";

      stage.appendChild(piece);
    }
  }

  document.getElementById("btn-staff-tap").addEventListener("click", function(){
    show("thanks");
    fireConfetti();
  });

  function start(data){
    show("start");
  }
  if (window.claude && window.claude.hot){
    window.claude.hot.ready ? window.claude.hot.ready(start) : start({});
  } else {
    start({});
  }
})();
</script>
