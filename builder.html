<meta charset="utf-8">
<title>おうちづくり お試し</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&family=Yusei+Magic&display=swap" rel="stylesheet">
<style>
/* layout: one phone-width column over the pixel-forest backdrop; one screen visible at a time
   (start → quiz → result → pick a part → hint → next quiz … → finished house).
   The part screen switches to a white page with the house fixed in the middle and a
   swipeable ring of choices orbiting it. Game UI pieces are drawn at 90% of their first size. */
:root{
  --bg:#1F2A4A;
  --panel:#2B3962;
  --ink:#FFFFFF;
  --dark:#2A2118;      /* text on white boxes, yellow buttons and the white part screen */
  --muted:#B9C3E6;
  --muted-dark:#6E6656;
  --pick:#FFC83D;      /* same yellow as the LET'S GO button */
  --edge:#0E1430;
  --paper:#FFFFFF;
  --ring:#ECE7DC;      /* faint orbit line on the white screen */
  --forest-sky:#0999F9; /* top colour of the forest backdrop, fills tall screens */
  --sky:#5DBEFB;       /* correct screen: pixel sky behind the clouds */
  --gloom:#2C4590;     /* wrong screen: blue gradient with manga gloom lines */
  --pixel:'DotGothic16','Hiragino Maru Gothic ProN',sans-serif;
  --arcade:'Press Start 2P','DotGothic16',monospace;   /* pixel lettering on the LET'S GO button */
  --hand:'Yusei Magic','Hiragino Maru Gothic ProN','Hiragino Sans',sans-serif;   /* cute hand-lettered text for copy, questions, notes */
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{
  background:var(--forest-sky);
  color:var(--ink);
  font-family:var(--hand);
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
/* forest backdrop: shown edge to edge (never cropped at the sides, so the trees stay whole at the
   screen edges), standing on the bottom of the screen; taller screens get more plain sky on top */
body::after{
  content:"";position:fixed;inset:0;z-index:-1;
  background:var(--forest-sky) url(assets/ui/bg_forest.jpg) center bottom / 100% auto no-repeat;
}
body.white::after,body.sky::after,body.gloom::after{display:none}
body.white{background:var(--paper);color:var(--dark)}
body.sky{background:var(--sky) url(assets/ui/bg_sky.png) center top / cover fixed;image-rendering:pixelated}
body.gloom{background:var(--gloom) url(assets/ui/bg_gloom.jpg) center top / cover fixed}
.app{max-width:440px;margin:0 auto;padding-block:18px 32px}
.screen{display:flex;flex-direction:column;align-items:center;gap:14px}
.trial-tag{
  align-self:flex-start;
  font-size:calc(.75rem + 2px);letter-spacing:.1em;
  background:var(--edge);color:var(--pick);
  padding:3px 8px;margin:0;
}
.plate{                       /* dark backing so white text reads over the forest */
  width:100%;
  background:color-mix(in srgb, var(--edge) 78%, transparent);
  border:3px solid var(--edge);
  padding:14px 12px;
  display:flex;flex-direction:column;align-items:center;gap:12px;
}
.img-btn{background:none;border:0;padding:0;cursor:pointer;line-height:0}
.img-btn:focus-visible,.abc:focus-visible,.orb:focus-visible,.plain-btn:focus-visible,.arrow:focus-visible{outline:3px solid var(--pick);outline-offset:3px}

/* start */
.start-head{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;margin-top:4vh}
.start-anniv{width:56%;height:auto}
.start-logo{width:66%;height:auto;filter:drop-shadow(0 2px 4px rgba(14,20,48,.7))}
.start-title{width:80%;height:auto;margin-top:18px}   /* 10px more air under the logo */
.start-sub{font-size:calc(1.15rem + 2px);margin:0;color:var(--ink);
  text-shadow:2px 0 0 var(--edge),-2px 0 0 var(--edge),0 2px 0 var(--edge),0 -2px 0 var(--edge),2px 2px 0 var(--edge),-2px 2px 0 var(--edge),2px -2px 0 var(--edge),-2px -2px 0 var(--edge)}
.panel{                     /* white see-through panel: start copy, question, hint */
  width:88%;
  background:color-mix(in srgb, var(--paper) 90%, transparent);
  color:var(--dark);
  border:3px solid var(--edge);border-radius:14px;
  padding:12px 14px;
  font-size:calc(1rem + 2px);line-height:1.75;
}
.start-lead{
  margin:2vh 0 0;
  text-align:center;
  word-break:keep-all;overflow-wrap:anywhere;   /* break only at the marked phrase ends */
}
.start-btn{
  width:63%;margin-top:2vh;
  aspect-ratio:1390/348;
  background:url(assets/ui/btn_yellow.png) center / 100% 100% no-repeat;
  border:0;cursor:pointer;
  font-family:var(--arcade);font-size:calc(.95rem + 2px);color:var(--dark);
  letter-spacing:.06em;
}

/* quiz */
.quiz-no{width:42%;max-width:180px;height:auto}
.qframe{width:90%;min-height:7.5em;display:flex;align-items:center;padding:16px 18px}
.abc-list{width:90%;display:flex;flex-direction:column;gap:9px}
.abc{
  width:100%;
  aspect-ratio:1390/349;
  background:center / 100% 100% no-repeat;
  border:0;cursor:pointer;
  font-family:var(--hand);font-size:calc(1.05rem + 2px);color:var(--dark);
  display:flex;align-items:center;gap:11px;
  padding:0 9%;
  text-align:left;
}
.abc b{font-weight:400;font-size:calc(1.17rem + 2px)}
.abc[data-l="A"]{background-image:url(assets/ui/btn_red.png);color:var(--paper);text-shadow:0 2px 0 rgba(120,30,0,.55)}
.abc[data-l="B"]{background-image:url(assets/ui/btn_yellow.png);color:var(--dark)}
.abc[data-l="C"]{background-image:url(assets/ui/btn_green.png);color:var(--paper);text-shadow:0 2px 0 rgba(20,80,0,.55)}

/* result: no frame, text and icon separate, icon sits in the middle of the screen */
.result{min-height:calc(100svh - 40px);gap:16px}
.result .grow{flex:1}
.result .low{padding-bottom:7vh}      /* back / next sit a little low on the screen */
.res-text{width:53%;height:auto}
.res-text.wrong{width:53%;transform-origin:6% 55%}   /* hinge for the drop */
.res-icon{width:42%;height:auto}
.res-icon.wrong{width:33%}
.box{
  width:90%;
  background:var(--paper);color:var(--dark);
  border:4px solid var(--edge);
  box-shadow:4px 4px 0 var(--edge);
  padding:11px 13px;
  line-height:1.7;
  font-size:calc(.95rem + 2px);
}
.box h2{font-weight:400;font-size:calc(.8rem + 2px);letter-spacing:.12em;margin:0 0 4px;color:#7A5B12}
.box p{margin:0}
.nav-img{height:41px;width:auto}
@media (prefers-reduced-motion:no-preference){
  .pop{animation:pop .65s cubic-bezier(.3,1.5,.5,1) both}
  @keyframes pop{
    0%{transform:scale(.55);opacity:0}
    45%{transform:scale(1.22);opacity:1}
    70%{transform:scale(.94)}
    100%{transform:scale(1)}
  }
}

/* part pick: white page, house fixed in the middle, choices orbit around it */
.step-count{font-size:calc(.85rem + 2px);letter-spacing:.12em;margin:0;color:var(--muted-dark)}
.banner{width:74%;max-width:306px}
#s-part{height:calc(100svh - 36px);gap:8px}   /* banner to the decide button fits one screen */
.dial{
  position:relative;
  width:100%;
  flex:1;min-height:0;
  touch-action:pan-y;
  user-select:none;-webkit-user-select:none;
  cursor:grab;
}
.dial.dragging{cursor:grabbing}
.orbit{
  position:absolute;left:50%;top:50%;
  width:84%;height:84%;
  transform:translate(-50%,-50%);
  border:2px dashed var(--ring);
  border-radius:50%;
  pointer-events:none;
}
.stage{
  position:absolute;left:50%;top:50%;
  height:66%;
  aspect-ratio:1290/2785;
  transform:translate(-50%,-50%);
  border:3px solid var(--dark);
  line-height:0;
  z-index:50;
  background:var(--paper);
}
.stage canvas{width:100%;height:100%;display:block}
.orb{
  position:absolute;left:0;top:0;
  width:76px;height:76px;
  margin:-38px 0 0 -38px;
  border-radius:50%;
  border:3px solid var(--dark);
  background:var(--paper);
  padding:0;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
  will-change:transform;
}
.orb img{max-width:78%;max-height:78%;object-fit:contain;pointer-events:none}
.orb.land img{max-width:100%;max-height:none;width:100%;height:100%;object-fit:cover}
.orb .sw{width:100%;height:100%;background-size:cover;background-position:center}
.orb.front{border-color:var(--pick);box-shadow:0 0 0 3px var(--dark)}
.pick-row{display:flex;align-items:center;justify-content:center;gap:16px;width:100%;flex:none}
.decide{flex:none}
.decide img{height:62px;width:auto}
.arrow{
  font-family:var(--hand);font-size:calc(1.1rem + 2px);
  width:40px;height:40px;
  border:3px solid var(--dark);background:var(--pick);color:var(--dark);
  cursor:pointer;
}
.pick-name{font-size:calc(1.25rem + 2px);min-width:9em;text-align:center;margin:0}
.swipe-note{font-size:calc(.8rem + 2px);color:var(--muted-dark);margin:0}

/* hint */
.hint-title{font-size:calc(1.26rem + 2px);color:var(--pick);margin:0;text-shadow:3px 3px 0 var(--edge)}
.plain-btn{
  font-family:var(--hand);font-size:calc(.9rem + 2px);
  background:var(--pick);color:var(--dark);
  border:3px solid var(--edge);box-shadow:3px 3px 0 var(--edge);
  padding:11px 16px;cursor:pointer;
}
.note{font-size:calc(.85rem + 2px);color:var(--muted);text-align:center;line-height:1.7;margin:0}
.panel p.note{color:var(--muted-dark);font-size:calc(.75rem + 2px);margin-top:8px}
.panel h2{font-weight:400;font-size:calc(.8rem + 2px);letter-spacing:.12em;margin:0 0 4px;color:#7A5B12}
.panel p{margin:0}
#s-hint,#s-notice{padding-top:6vh;gap:18px}
/* ハズレ (a decoy QR code): big word, small nudge, no effect on progress */
.miss{min-height:calc(100svh - 40px);gap:14px}
.miss .grow{flex:1}
.miss-title{margin:0;font-size:calc(3.2rem + 2px);color:var(--ink);line-height:1.1;letter-spacing:.06em;
  text-shadow:3px 0 0 var(--edge),-3px 0 0 var(--edge),0 3px 0 var(--edge),0 -3px 0 var(--edge),3px 3px 0 var(--edge),-3px 3px 0 var(--edge),3px -3px 0 var(--edge),-3px -3px 0 var(--edge),5px 6px 0 var(--edge)}
.miss-icon{width:30%;height:auto}
.miss-text{margin:0;font-size:calc(1rem + 2px);color:var(--ink);
  text-shadow:2px 0 0 var(--edge),-2px 0 0 var(--edge),0 2px 0 var(--edge),0 -2px 0 var(--edge)}
.miss-hint{margin:6px 0 0;width:88%;text-align:center;font-size:calc(.85rem + 2px);line-height:1.7;
  background:color-mix(in srgb, var(--paper) 90%, transparent);color:var(--dark);border:3px solid var(--edge);border-radius:14px;padding:10px 12px}
#btn-restart{background:var(--paper);font-size:calc(.8rem + 2px)}

/* done */
.done-title{font-size:calc(1.53rem + 2px);color:var(--pick);margin:0;text-shadow:3px 3px 0 var(--edge)}
.final{width:min(78vw, 320px);border:4px solid var(--edge);box-shadow:0 0 0 3px var(--pick)}

@media (prefers-reduced-motion:no-preference){
  .screen{animation:in .25s ease both}
  @keyframes in{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
  .abc:active,.img-btn:active,.arrow:active{transform:scale(.97)}
}
</style>

<div class="app">

  <section class="screen" id="s-start">
    <p class="trial-tag">お試し版</p>
    <div class="start-head">
      <img class="start-anniv" src="assets/ui/anniv.png" alt="22nd ANNIVERSARY">
      <img class="start-logo" src="assets/ui/logo.png" alt="プリンシパルホーム">
      <img class="start-title" src="assets/ui/title_house.png" alt="HOUSE QUIZ RALLY">
      <p class="start-sub">おうちづくりクイズラリー</p>
    </div>
    <p class="panel start-lead">クイズに正解して、<wbr>家のパーツをゲット!<br>5問クリアで、<wbr>あなただけの<wbr>理想の家が完成。</p>
    <button class="start-btn" id="btn-start">LET'S GO!</button>
  </section>

  <section class="screen" id="s-quiz" hidden>
    <img class="quiz-no" id="q-no" src="assets/ui/quiz_1.png" alt="QUIZ 1">
    <div class="panel qframe"><span id="q-text"></span></div>
    <div class="abc-list" id="q-choices"></div>
  </section>

  <section class="screen result" id="s-wrong" hidden>
    <div class="grow"></div>
    <img class="res-text wrong" id="wrong-text" src="assets/ui/res_wrong_text.png" alt="不正解">
    <img class="res-icon wrong" src="assets/ui/res_wrong_icon.png" alt="">
    <div class="grow"></div>
    <button class="img-btn low" id="btn-wrong-back"><img class="nav-img" src="assets/ui/btn_back.png" alt="もどる"></button>
  </section>

  <section class="screen result" id="s-correct" hidden>
    <div class="grow"></div>
    <img class="res-text" id="correct-text" src="assets/ui/res_correct_text.png" alt="正解!">
    <img class="res-icon" src="assets/ui/res_correct_icon.png" alt="">
    <div class="box"><h2>かいせつ</h2><p id="explain"></p></div>
    <div class="grow"></div>
    <button class="img-btn low" id="btn-to-part"><img class="nav-img" src="assets/ui/btn_next.png" alt="つぎへ"></button>
  </section>

  <section class="screen" id="s-part" hidden>
    <p class="step-count" id="part-count">パーツ 1 / 5</p>
    <img class="banner" id="banner" src="assets/ui/label_land.png" alt="土地をえらぼう!">
    <div class="dial" id="dial">
      <div class="orbit"></div>
      <div class="stage"><canvas id="cv" width="1290" height="2785"></canvas></div>
    </div>
    <div class="pick-row">
      <button class="arrow" id="prev" aria-label="ひとつ前">◀</button>
      <p class="pick-name" id="pick-name" aria-live="polite"></p>
      <button class="arrow" id="nextopt" aria-label="ひとつ次">▶</button>
    </div>
    <p class="swipe-note">左右にスライドして、くるっと回してえらぼう</p>
    <button class="img-btn decide" id="btn-part-next"><img src="assets/ui/btn_decide.png" alt="けってい"></button>
  </section>

  <section class="screen" id="s-hint" hidden>
    <p class="hint-title">つぎの問題はどこ?</p>
    <div class="panel"><h2>ヒント</h2><p id="hint"></p>
      <p class="note">見つけたら、スマホの<b>カメラ</b>でQRコードを読みとってね。<br>（LINEなどのアプリで読むと、続きから遊べないよ）</p></div>
  </section>

  <section class="screen" id="s-notice" hidden>
    <p class="hint-title" id="notice-title"></p>
    <div class="panel"><p id="notice-text"></p><p class="note" id="notice-hint"></p></div>
    <button class="plain-btn" id="btn-restart" hidden>最初からやりなおす</button>
  </section>

  <section class="screen miss" id="s-miss" hidden>
    <div class="grow"></div>
    <p class="miss-title">ハズレ!</p>
    <img class="miss-icon" src="assets/ui/res_wrong_icon.png" alt="">
    <p class="miss-text">ちがうところを探してね</p>
    <p class="miss-hint" id="miss-hint" hidden></p>
    <div class="grow"></div>
  </section>

  <section class="screen" id="s-done" hidden>
    <div class="plate">
      <p class="done-title">おうち完成!</p>
      <img class="final" id="final" alt="完成したおうちの画像">
      <p class="note">画像を長押しして保存してみてください。<br>本番では保存ボタンをつけます。</p>
      <button class="plain-btn" id="btn-again">最初から遊ぶ</button>
    </div>
  </section>

</div>

<script>
(function(){
  "use strict";
  var P = "assets/parts/", U = "assets/ui/";
  var W = 1290, H = 2785;
  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // 仮の問題（あとで本番の問題に入れかえる）
  var QUIZ = [
    { q:"日本の一戸建てで、いちばん多い家のつくりは?",
      c:["木造","鉄骨造","コンクリート造"], a:0,
      ex:"日本の一戸建ては、木でつくる「木造」がいちばん多いんだよ。",
      hint:"（仮）受付の近く、大きな観葉植物のまわりを探してみよう!" },
    { q:"家の広さの「1坪（つぼ）」は、たたみ何まい分くらい?",
      c:["1まい","2まい","4まい"], a:1,
      ex:"1坪は、たたみ約2まい分。だいたい3.3平方メートルだよ。",
      hint:"（仮）おいしいにおいがする場所。キッチンコーナーを見てみよう!" },
    { q:"屋根の上にのせて、電気をつくるものは?",
      c:["太陽光パネル","風車","アンテナ"], a:0,
      ex:"太陽の光で電気をつくるのが「太陽光パネル」。電気代の節約にもなるよ。",
      hint:"（仮）外が見える大きな窓のそば。カーテンのうらに注目!" },
    { q:"「平屋（ひらや）」って、どんな家?",
      c:["屋上がある家","地下室がある家","1階だけの家"], a:2,
      ex:"平屋は1階だけの家。階段がないので、くらしやすいと人気なんだ。",
      hint:"（仮）子どもが遊べるキッズスペース。おもちゃ箱のあたりかも?" },
    { q:"家を建てる前に、土地の神さまにお祈りする行事は?",
      c:["上棟式","地鎮祭","引っこし"], a:1,
      ex:"「地鎮祭（じちんさい）」は、工事の安全をお祈りする行事だよ。",
      hint:"" }
  ];

  var STEPS = [
    { key:"land", label:"label_land", opts:[
      { id:"sea", name:"海のそば", src:P+"land_sea.jpg" },
      { id:"mountain", name:"山の中", src:P+"land_mountain.jpg" },
      { id:"town", name:"街中", src:P+"land_town.jpg" },
      { id:"space", name:"宇宙", src:P+"land_space.jpg" }
    ]},
    { key:"house", label:"label_house", opts:[
      { id:"flat", name:"平屋", src:P+"house_flat.webp", shape:P+"house_flat_shape.png" },
      { id:"2f", name:"2階建て", src:P+"house_2f.webp", shape:P+"house_2f_shape.png" },
      { id:"3f", name:"屋上つき3階建て", src:P+"house_3f.webp", shape:P+"house_3f_shape.png" },
      { id:"garage", name:"ガレージハウス", src:P+"house_garage.webp", shape:P+"house_garage_shape.png" },
      { id:"castle", name:"お城", src:P+"house_castle.webp", shape:P+"house_castle_shape.png" }
    ]},
    { key:"wall", label:"label_wall", opts:[
      { id:"tile", name:"白いタイル", src:P+"wall_tile.jpg" },
      { id:"galva", name:"ガルバリウム", src:P+"wall_galva.jpg", tile:.8 },
      { id:"log", name:"ログハウス風", src:P+"wall_log.jpg" },
      { id:"candy", name:"お菓子の家風", src:P+"wall_candy.jpg" },
      { id:"gold", name:"金ぱく", src:P+"wall_gold.jpg" }
    ]},
    { key:"garden", label:"label_garden", opts:[
      { id:"pool", name:"プール", src:P+"garden_pool.webp", edge:.142 },
      { id:"flower", name:"ガーデニング", src:P+"garden_flower.webp", edge:.031 },
      { id:"farm", name:"畑", src:P+"garden_farm.webp", edge:.058 },
      { id:"lawn", name:"芝生の庭", src:P+"garden_lawn.webp", edge:.144 }
    ]},
    { key:"pet", label:"label_pet", opts:[
      { id:"dog", name:"犬", src:P+"pet_dog.webp" },
      { id:"cat", name:"ねこ", src:P+"pet_cat.webp" },
      { id:"bird", name:"インコ", src:P+"pet_bird.webp" },
      { id:"momonga", name:"モモンガ", src:P+"pet_momonga.webp" },
      { id:"dino", name:"恐竜", src:P+"pet_dino.webp" }
    ]}
  ];

  // layout from the placement sketch (430 x 932 screen), as fractions of the picture.
  // box = x, y, w, h of the area a part may fill; parts keep their shape and sit on the box bottom.
  var BOX = {
    house:  { x:.206, y:.294, w:.588, h:.374 },   // house bottom = 1/3 from the bottom
    garden: { x:.026, y:.655, w:.840, h:.345 },   // from the house front to the bottom edge
    fly:    { x:.118, y:.154, w:.300, h:.137 },   // bird, momonga: upper left of the house
    land:   { x:.702, y:.603, w:.278, h:.204 },   // dog, cat: lower right, over the garden edge
    dino:   { x:.560, y:.450, w:.430, h:.360 }    // the dino needs a bigger box in the same corner
  };
  var PET_BOX = { dog:"land", cat:"land", bird:"fly", momonga:"fly", dino:"dino" };
  var GROUND = .75;               // house bottom = where the garden's ground begins (fraction of height)
  var HOUSE_ZOOM = 1.1, GARDEN_ZOOM = 1.3;
  var WALL_TILE = 320;            // px of one wall texture tile on the picture (times the wall's own tile factor)
  var BARE_WALL = "#E9E6E1";      // wall color before a wall is chosen

  var cache = {};
  function load(src){
    if (!cache[src]){
      cache[src] = new Promise(function(res){
        var im = new Image();
        im.onload = function(){ res(im); };
        im.onerror = function(){ res(null); };
        im.src = src;
      });
    }
    return cache[src];
  }
  STEPS.forEach(function(s){ s.opts.forEach(function(o){ load(o.src); if (o.shape) load(o.shape); }); });
  for (var qi = 1; qi <= 5; qi++) load(U + "quiz_" + qi + ".png");
  ["res_correct_text","res_correct_icon","res_wrong_text","res_wrong_icon"].forEach(function(n){ load(U + n + ".png"); });
  var annivP = load(U + "anniv.png"), logoP = load(U + "logo.png");

  // ---------- music: starts with LET'S GO, loops quietly, rests on the wrong-answer screen.
  // An <audio> element keeps playing when an iPhone is on silent (pure Web Audio does not);
  // its sound goes through a gain node because iPhones ignore audio.volume. The loop is done
  // by hand on "ended", since the loop attribute can stop at the song's end on iPhones.
  var BGM_VOLUME = 0.07;
  var bgm = new Audio("assets/audio/bgm.mp3");
  bgm.preload = "auto";
  bgm.addEventListener("ended", function(){
    bgm.currentTime = 0;
    if (!musicPaused) bgm.play().catch(function(){});
  });
  var musicOn = false, musicPaused = false, audioCtx = null;
  function startMusic(){
    if (musicOn) return;
    musicOn = true;
    try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (e){}
    var AC = window.AudioContext || window.webkitAudioContext;
    if (AC){
      try {
        audioCtx = new AC();
        var gain = audioCtx.createGain();
        gain.gain.value = BGM_VOLUME;
        audioCtx.createMediaElementSource(bgm).connect(gain);
        gain.connect(audioCtx.destination);
      } catch (e){ audioCtx = null; }
    }
    if (!audioCtx) bgm.volume = BGM_VOLUME;
    playMusic();
  }
  function playMusic(){
    musicPaused = false;
    if (!musicOn) return;
    if (audioCtx && audioCtx.state !== "running") audioCtx.resume();
    if (bgm.paused) bgm.play().catch(function(){});
  }
  function pauseMusic(){
    musicPaused = true;
    bgm.pause();
  }
  document.addEventListener("visibilitychange", function(){
    if (document.hidden) pauseMusic();
    else if (document.getElementById("s-wrong").hidden) playMusic();
  });

  var state, pick;
  function reset(){
    state = { q:0, done:0 };         // done = how many questions are cleared (parts chosen)
    pick = { land:"sea", house:"2f", wall:"tile", garden:"lawn", pet:"dog" };
  }
  reset();

  // ---------- progress is kept on the phone, so each QR code continues the same house
  var SAVE_KEY = "house-quiz-rally";
  function saveProgress(){
    try { localStorage.setItem(SAVE_KEY, JSON.stringify({ done: state.done, pick: pick })); } catch (e){}
  }
  function loadProgress(){
    try {
      var d = JSON.parse(localStorage.getItem(SAVE_KEY) || "null");
      if (d && typeof d.done === "number"){
        state.done = Math.max(0, Math.min(5, d.done));
        for (var k in pick) if (d.pick && d.pick[k]) pick[k] = d.pick[k];
      }
    } catch (e){}
  }
  function clearProgress(){
    try { localStorage.removeItem(SAVE_KEY); } catch (e){}
  }

  // what each QR code opens (the part after # in its link). The start code also leads to QUIZ 1.
  var QR = { "go-7kx2":0, "q2-m4p9":1, "q3-t8w3":2, "q4-c5n7":3, "q5-h2v6":4 };
  var MISS = { "x1-r9d3":1 };     // ハズレ codes: they never change the saved progress

  function opt(key){
    var s = STEPS.filter(function(x){ return x.key === key; })[0];
    return s.opts.filter(function(o){ return o.id === pick[key]; })[0];
  }

  // ---------- screens
  var screens = ["start","quiz","wrong","correct","part","hint","notice","miss","done"];
  function show(name){
    screens.forEach(function(n){ document.getElementById("s-" + n).hidden = (n !== name); });
    document.body.classList.toggle("white", name === "part");
    document.body.classList.toggle("sky", name === "correct");
    document.body.classList.toggle("gloom", name === "wrong");
    if (name === "wrong") pauseMusic(); else playMusic();
    window.scrollTo(0, 0);
  }
  // 不正解: the right side suddenly drops, as if a hinge on the left gave way.
  // Runs through the Web Animations API once the image is ready, so it plays every time.
  function dropText(el){
    if (el.getAnimations) el.getAnimations().forEach(function(a){ a.cancel(); });
    if (reduceMotion || !el.animate) return;
    var ready = el.decode ? el.decode().catch(function(){}) : Promise.resolve();
    ready.then(function(){
      el.animate([
        { transform:"rotate(0)", offset:0 },
        { transform:"rotate(0)", offset:.3 },
        { transform:"rotate(17deg)", offset:.48, easing:"ease-out" },
        { transform:"rotate(11deg)", offset:.62 },
        { transform:"rotate(15deg)", offset:.76 },
        { transform:"rotate(14deg)", offset:1 }
      ], { duration:900, fill:"forwards" });
    });
  }
  function replayPop(el){
    el.classList.remove("pop");
    void el.offsetWidth;
    el.classList.add("pop");
  }

  function showQuiz(){
    var Q = QUIZ[state.q];
    var no = document.getElementById("q-no");
    no.src = U + "quiz_" + (state.q + 1) + ".png";
    no.alt = "QUIZ " + (state.q + 1);
    document.getElementById("q-text").textContent = Q.q;
    var list = document.getElementById("q-choices");
    list.innerHTML = "";
    ["A","B","C"].forEach(function(L, i){
      var b = document.createElement("button");
      b.className = "abc";
      b.id = "ans-" + L;
      b.setAttribute("data-l", L);
      var k = document.createElement("b");
      k.textContent = L;
      var t = document.createElement("span");
      t.textContent = Q.c[i];
      b.appendChild(k); b.appendChild(t);
      b.addEventListener("click", function(){
        startMusic();                  // a page opened from a QR code has had no tap yet
        if (i === Q.a){
          document.getElementById("explain").textContent = Q.ex;
          show("correct");
          replayPop(document.getElementById("correct-text"));
        } else {
          show("wrong");
          dropText(document.getElementById("wrong-text"));
        }
      });
      list.appendChild(b);
    });
    show("quiz");
  }

  // ---------- house drawing
  var cv = document.getElementById("cv");
  var ctx = cv.getContext("2d");

  // fit an image into a box (fractions of the picture), keep its shape, stand it on the box bottom
  function place(img, b){
    var bw = b.w * W, bh = b.h * H;
    var k = Math.min(bw / img.width, bh / img.height);
    var w = img.width * k, h = img.height * k;
    return { x: b.x * W + (bw - w) / 2, y: b.y * H + bh - h, w: w, h: h };
  }

  // the house walls are see-through: paint the wall texture inside the house shape, then the house on top
  function zoom(r, k){
    var w = r.w * k, h = r.h * k;
    return { x: r.x + (r.w - w) / 2, y: r.y + r.h - h, w: w, h: h };
  }

  function drawHouse(hImg, shapeImg, tImg, tile){
    var r = zoom(place(hImg, BOX.house), HOUSE_ZOOM);
    r.y = GROUND * H - r.h;                   // stand the house on the garden's top edge
    var f = document.createElement("canvas");
    f.width = Math.ceil(r.w); f.height = Math.ceil(r.h);
    var fx = f.getContext("2d");
    if (tImg){
      var t = WALL_TILE * (tile || 1);
      for (var yy = 0; yy < f.height; yy += t)
        for (var xx = 0; xx < f.width; xx += t) fx.drawImage(tImg, xx, yy, t, t);
    } else {
      fx.fillStyle = BARE_WALL;
      fx.fillRect(0, 0, f.width, f.height);
    }
    fx.globalCompositeOperation = "destination-in";
    fx.drawImage(shapeImg, 0, 0, f.width, f.height);
    ctx.drawImage(f, r.x, r.y, r.w, r.h);
    ctx.drawImage(hImg, r.x, r.y, r.w, r.h);
  }

  // garden: bigger than its box (sides may run off the picture), its ground edge meets the house bottom
  function drawGarden(img, edge){
    var r = zoom(place(img, BOX.garden), GARDEN_ZOOM);
    r.y = GROUND * H - edge * r.h;
    ctx.drawImage(img, r.x, r.y, r.w, r.h);
  }

  function drawIn(img, b){
    var r = place(img, b);
    ctx.drawImage(img, r.x, r.y, r.w, r.h);
  }

  var drawSeq = 0;
  // upto = how many parts to show (1 = land only … 5 = everything)
  function render(upto, withTitle){
    var seq = ++drawSeq;
    var land = opt("land"), house = opt("house"), wall = opt("wall"), garden = opt("garden"), pet = opt("pet");
    return Promise.all([
      load(land.src), load(house.src), load(house.shape), load(wall.src),
      load(garden.src), load(pet.src), annivP, logoP
    ]).then(function(r){
      if (seq !== drawSeq) return;
      ctx.clearRect(0, 0, W, H);
      ctx.drawImage(r[0], 0, 0, W, H);
      if (upto >= 2) drawHouse(r[1], r[2], upto >= 3 ? r[3] : null, wall.tile);
      if (upto >= 4) drawGarden(r[4], garden.edge);
      if (upto >= 5) drawIn(r[5], BOX[PET_BOX[pet.id]]);
      if (withTitle){
        var y = Math.round(H * 0.055);
        if (r[6]){
          var aw = W * 0.6, ah = r[6].height * aw / r[6].width;
          ctx.drawImage(r[6], (W - aw) / 2, y, aw, ah);
          y += ah + 30;
        }
        if (r[7]){
          var lw = W * 0.78, lh = r[7].height * lw / r[7].width;
          ctx.save();
          ctx.shadowColor = "rgba(14,20,48,.75)";   // white logo needs a shadow on light skies
          ctx.shadowBlur = 18;
          ctx.shadowOffsetY = 4;
          ctx.drawImage(r[7], (W - lw) / 2, y, lw, lh);
          ctx.restore();
        }
      }
    });
  }

  // ---------- part ring: choices orbit the house; the one at the front (bottom) is chosen
  var dial = document.getElementById("dial");
  var orbs = [], rot = 0, frontIdx = -1, anim = null, curStep = null;

  function wrap(i, n){ return ((i % n) + n) % n; }

  function layoutRing(){
    var n = orbs.length; if (!n) return;
    var w = dial.clientWidth, h = dial.clientHeight;
    var cx = w / 2, cy = h / 2, rx = w * 0.42, ry = h * 0.42;
    orbs.forEach(function(el, i){
      var a = (i - rot) * 2 * Math.PI / n;          // 0 = front (bottom)
      var depth = (Math.cos(a) + 1) / 2;            // 1 front … 0 back
      var x = cx + rx * Math.sin(a), y = cy + ry * Math.cos(a);
      var sc = 0.7 + 0.5 * depth;
      el.style.transform = "translate(" + x.toFixed(1) + "px," + y.toFixed(1) + "px) scale(" + sc.toFixed(3) + ")";
      el.style.zIndex = String(Math.round(depth * 40) + (depth > 0.9 ? 20 : 0));
      el.style.opacity = (0.55 + 0.45 * depth).toFixed(2);
    });
    var f = wrap(Math.round(rot), n);
    if (f !== frontIdx){
      frontIdx = f;
      orbs.forEach(function(el, i){
        el.classList.toggle("front", i === f);
        el.setAttribute("aria-pressed", String(i === f));
      });
      var o = curStep.opts[f];
      pick[curStep.key] = o.id;
      document.getElementById("pick-name").textContent = o.name;
      render(state.q + 1, false);    // the house updates as the ring turns
    }
  }

  function spinTo(target){
    if (anim) cancelAnimationFrame(anim);
    if (reduceMotion){ rot = target; layoutRing(); return; }
    var from = rot, t0 = null, dur = 320;
    function stepFn(t){
      if (t0 === null) t0 = t;
      var k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
      rot = from + (target - from) * e;
      layoutRing();
      if (k < 1) anim = requestAnimationFrame(stepFn); else anim = null;
    }
    anim = requestAnimationFrame(stepFn);
  }

  // nearest way round to option i
  function spinToIndex(i){
    var n = orbs.length, base = Math.round(rot), cur = wrap(base, n);
    var d = i - cur; if (d > n / 2) d -= n; if (d < -n / 2) d += n;
    spinTo(base + d);
  }

  var drag = null;
  dial.addEventListener("pointerdown", function(e){
    if (anim){ cancelAnimationFrame(anim); anim = null; }
    drag = { x:e.clientX, rot:rot, moved:false, id:e.pointerId };
    dial.setPointerCapture(e.pointerId);
    dial.classList.add("dragging");
  });
  dial.addEventListener("pointermove", function(e){
    if (!drag || e.pointerId !== drag.id) return;
    var dx = e.clientX - drag.x;
    if (Math.abs(dx) > 4) drag.moved = true;
    rot = drag.rot - dx / 90;            // drag right → the ring turns right
    layoutRing();
  });
  function endDrag(e){
    if (!drag || e.pointerId !== drag.id) return;
    var tapped = !drag.moved;
    drag = null;
    dial.classList.remove("dragging");
    if (tapped){
      var el = document.elementFromPoint(e.clientX, e.clientY);
      var orb = el && el.closest ? el.closest(".orb") : null;
      if (orb){ spinToIndex(orbs.indexOf(orb)); return; }
    }
    spinTo(Math.round(rot));
  }
  dial.addEventListener("pointerup", endDrag);
  dial.addEventListener("pointercancel", endDrag);
  window.addEventListener("resize", layoutRing);
  document.getElementById("prev").addEventListener("click", function(){ spinTo(Math.round(rot) - 1); });
  document.getElementById("nextopt").addEventListener("click", function(){ spinTo(Math.round(rot) + 1); });
  dial.addEventListener("keydown", function(e){
    if (e.key === "ArrowLeft"){ e.preventDefault(); spinTo(Math.round(rot) - 1); }
    if (e.key === "ArrowRight"){ e.preventDefault(); spinTo(Math.round(rot) + 1); }
  });

  function showPart(){
    var i = state.q, s = STEPS[i];
    curStep = s;
    document.getElementById("part-count").textContent = "パーツ " + (i + 1) + " / " + STEPS.length;
    var banner = document.getElementById("banner");
    banner.src = U + s.label + ".png";
    banner.alt = "";
    orbs.forEach(function(el){ el.remove(); });
    orbs = [];
    s.opts.forEach(function(o){
      var b = document.createElement("button");
      b.className = "orb" + (s.key === "land" ? " land" : "");
      b.id = "opt-" + s.key + "-" + o.id;
      b.setAttribute("aria-label", o.name);
      b.addEventListener("click", function(e){ if (e.detail === 0) spinToIndex(orbs.indexOf(b)); }); // keyboard
      if (s.key === "wall"){
        var sw = document.createElement("span");
        sw.className = "sw";
        sw.style.backgroundImage = "url(" + o.src + ")";
        b.appendChild(sw);
      } else {
        var im = document.createElement("img");
        im.src = o.src; im.alt = "";
        b.appendChild(im);
      }
      dial.appendChild(b);
      orbs.push(b);
    });
    var start = s.opts.map(function(o){ return o.id; }).indexOf(pick[s.key]);
    rot = Math.max(0, start);
    frontIdx = -1;
    show("part");
    layoutRing();
  }

  function finish(){
    render(5, true).then(function(){
      document.getElementById("final").src = cv.toDataURL("image/jpeg", 0.9);
      show("done");
    });
  }

  // ---------- buttons
  document.getElementById("btn-start").addEventListener("click", function(){
    startMusic();
    showQuiz();
  });
  document.getElementById("btn-wrong-back").addEventListener("click", function(){ show("quiz"); });
  document.getElementById("btn-to-part").addEventListener("click", showPart);
  document.getElementById("btn-part-next").addEventListener("click", function(){
    if (anim){ cancelAnimationFrame(anim); anim = null; rot = Math.round(rot); layoutRing(); }
    state.done = Math.max(state.done, state.q + 1);
    saveProgress();
    if (state.q === QUIZ.length - 1){ finish(); return; }
    document.getElementById("hint").textContent = QUIZ[state.q].hint;
    show("hint");
  });
  function startOver(){
    clearProgress();
    reset();
    show("start");
  }
  document.getElementById("btn-again").addEventListener("click", startOver);
  document.getElementById("btn-restart").addEventListener("click", startOver);

  function notice(title, text, hint, canRestart){
    document.getElementById("notice-title").textContent = title;
    document.getElementById("notice-text").textContent = text;
    document.getElementById("notice-hint").textContent = hint ? "ヒント：" + hint : "";
    document.getElementById("btn-restart").hidden = !canRestart;
    show("notice");
  }
  function nextHint(){ return state.done >= 1 ? QUIZ[state.done - 1].hint : ""; }

  // open the screen that matches the scanned QR code and the progress saved on this phone
  function route(){
    loadProgress();
    var code = location.hash.replace(/^#/, "");
    if (MISS.hasOwnProperty(code)){
      var mh = document.getElementById("miss-hint");
      mh.hidden = !(state.done >= 1 && state.done < 5);
      if (!mh.hidden) mh.textContent = "つぎは QUIZ " + (state.done + 1) + "。ヒント：" + nextHint();
      show("miss");
      return;
    }
    var q = QR.hasOwnProperty(code) ? QR[code] : 0;     // no code (plain link) = the start code
    if (state.done >= 5){ finish(); return; }
    if (q === 0){
      if (state.done === 0) show("start");
      else notice("つづきから遊ぼう!", "つぎは QUIZ " + (state.done + 1) + " のQRコードを探してね。", nextHint(), true);
      return;
    }
    if (q === state.done){ state.q = q; showQuiz(); return; }
    if (q > state.done){
      notice("まだ答えられないよ",
        state.done === 0 ? "まずは、スタートのQRコードから始めてね。"
                         : "先に QUIZ " + (state.done + 1) + " のQRコードを探してね。",
        nextHint(), false);
      return;
    }
    notice("この問題はクリアずみ!", "つぎは QUIZ " + (state.done + 1) + " のQRコードを探してね。", nextHint(), false);
  }
  window.addEventListener("hashchange", route);
  route();
})();
</script>
